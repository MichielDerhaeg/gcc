name: RISC-V GCC test

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: riscv-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.arch }}/${{ matrix.abi }}
    runs-on: ubuntu-latest
    timeout-minutes: 350

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: rv64gc
            abi: lp64d
          - arch: rv32gc
            abi: ilp32d

    env:
      RISCV: ${{ github.workspace }}/install
      TARGET_ARCH: ${{ matrix.arch }}
      TARGET_ABI: ${{ matrix.abi }}

    steps:
      - name: Checkout GCC
        uses: actions/checkout@v4
        with:
          path: gcc
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake autotools-dev curl python3 python3-pip \
            python3-tomli libmpc-dev libmpfr-dev libgmp-dev gawk \
            build-essential bison flex texinfo gperf libtool patchutils bc \
            zlib1g-dev libexpat-dev ninja-build git cmake libglib2.0-dev \
            libslirp-dev libncurses-dev dejagnu expect \
            python3-pyelftools

      - name: Checkout riscv-gnu-toolchain
        uses: actions/checkout@v4
        with:
          repository: riscv-collab/riscv-gnu-toolchain
          path: riscv-gnu-toolchain
          fetch-depth: 1

      - name: Initialize required submodules
        working-directory: riscv-gnu-toolchain
        run: |
          # Only fetch submodules required for a newlib (--disable-linux) build:
          # binutils, newlib, dejagnu. GCC sources come from the PR checkout
          # via --with-gcc-src, so we don't initialize the gcc submodule.
          git submodule update --init --depth 1 --recursive binutils
          git submodule update --init --depth 1 --recursive newlib
          git submodule update --init --depth 1 --recursive dejagnu

      - name: Configure riscv-gnu-toolchain
        working-directory: riscv-gnu-toolchain
        run: |
          ./configure \
            --prefix="$RISCV" \
            --with-arch="$TARGET_ARCH" \
            --with-abi="$TARGET_ABI" \
            --with-gcc-src="$GITHUB_WORKSPACE/gcc" \
            --disable-linux \
            --disable-gdb \
            --disable-multilib

      - name: Build newlib toolchain
        working-directory: riscv-gnu-toolchain
        run: |
          make -j"$(nproc)" newlib
          echo "$RISCV/bin" >> "$GITHUB_PATH"

      - name: Run GCC testsuite (newlib)
        working-directory: riscv-gnu-toolchain
        run: |
          # Don't fail the job on individual testsuite FAILs; we report them.
          make -j"$(nproc)" check-gcc-newlib || true

      - name: Collect test results
        id: collect
        run: |
          set -e
          mkdir -p test-results
          # Locate gcc/g++ .sum files produced by the build.
          find riscv-gnu-toolchain/build-gcc-newlib-stage2 -name '*.sum' \
            -exec cp -v {} test-results/ \; || true

          # Aggregate pass/fail counters from the .sum files.
          summary=test-results/summary.txt
          : > "$summary"
          for f in test-results/*.sum; do
            [ -f "$f" ] || continue
            echo "=== $(basename "$f") ===" >> "$summary"
            grep -E '^# of ' "$f" >> "$summary" || true
            echo "" >> "$summary"
          done

          # Extract unexpected failures (FAIL, XPASS, UNRESOLVED, ERROR).
          fails=test-results/unexpected.txt
          : > "$fails"
          for f in test-results/*.sum; do
            [ -f "$f" ] || continue
            awk -v file="$(basename "$f")" '
              /^FAIL: / || /^XPASS: / || /^UNRESOLVED: / || /^ERROR: / {
                print file ": " $0
              }' "$f" >> "$fails"
          done

          fail_count=$(wc -l < "$fails" | tr -d ' ')
          sum_count=$(ls -1 test-results/*.sum 2>/dev/null | wc -l | tr -d ' ')
          echo "fail_count=$fail_count" >> "$GITHUB_OUTPUT"
          echo "sum_count=$sum_count" >> "$GITHUB_OUTPUT"
          echo "Unexpected results: $fail_count"
          if [ "$sum_count" = "0" ]; then
            echo "::error::No .sum files produced; treating as build failure."
            exit 1
          fi

      - name: Compare against baseline
        id: compare
        run: |
          set -e
          baseline="gcc/.github/riscv-baseline/unexpected-${TARGET_ARCH}-${TARGET_ABI}.txt"
          current="test-results/unexpected.txt"
          regressions="test-results/regressions.txt"
          fixed="test-results/fixed.txt"

          if [ ! -f "$baseline" ]; then
            echo "::warning::No baseline found at $baseline; skipping comparison."
            : > "$regressions"
            : > "$fixed"
            echo "regression_count=0" >> "$GITHUB_OUTPUT"
            echo "fixed_count=0" >> "$GITHUB_OUTPUT"
            echo "has_baseline=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Use sorted line-based set diffs. Both files share the same
          # "<sumfile>: <STATUS>: <testname>" format produced by the
          # collect step, so plain comm works after sorting.
          sort -u "$baseline" > /tmp/baseline.sorted
          sort -u "$current" > /tmp/current.sorted

          # Regressions: in current but not in baseline.
          comm -23 /tmp/current.sorted /tmp/baseline.sorted > "$regressions"
          # Fixed: in baseline but not in current.
          comm -13 /tmp/current.sorted /tmp/baseline.sorted > "$fixed"

          regression_count=$(wc -l < "$regressions" | tr -d ' ')
          fixed_count=$(wc -l < "$fixed" | tr -d ' ')

          echo "regression_count=$regression_count" >> "$GITHUB_OUTPUT"
          echo "fixed_count=$fixed_count" >> "$GITHUB_OUTPUT"
          echo "has_baseline=true" >> "$GITHUB_OUTPUT"
          echo "Regressions vs baseline: $regression_count"
          echo "Fixed vs baseline:       $fixed_count"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcc-testsuite-results-${{ env.TARGET_ARCH }}-${{ env.TARGET_ABI }}
          path: test-results/
          if-no-files-found: warn

      - name: Post test summary to PR
        if: always()
        uses: actions/github-script@v7
        env:
          FAIL_COUNT: ${{ steps.collect.outputs.fail_count }}
          REGRESSION_COUNT: ${{ steps.compare.outputs.regression_count }}
          FIXED_COUNT: ${{ steps.compare.outputs.fixed_count }}
          HAS_BASELINE: ${{ steps.compare.outputs.has_baseline }}
        with:
          script: |
            const fs = require('fs');
            const failCount = parseInt(process.env.FAIL_COUNT || '0', 10);
            const regressionCount =
              parseInt(process.env.REGRESSION_COUNT || '0', 10);
            const fixedCount = parseInt(process.env.FIXED_COUNT || '0', 10);
            const hasBaseline = process.env.HAS_BASELINE === 'true';
            const arch = '${{ env.TARGET_ARCH }}';
            const abi = '${{ env.TARGET_ABI }}';

            const readOrEmpty = (p) => {
              try { return fs.readFileSync(p, 'utf8'); } catch (e) { return ''; }
            };
            const truncate = (s, max) =>
              s.length > max
                ? s.slice(0, max) + '\n... (truncated)'
                : s;

            const summary = readOrEmpty('test-results/summary.txt');
            const regressions = readOrEmpty('test-results/regressions.txt');
            const fixed = readOrEmpty('test-results/fixed.txt');
            const allUnexpected = readOrEmpty('test-results/unexpected.txt');
            if (!summary.trim()) {
              core.info('No test summary available; not posting a PR comment.');
              return;
            }

            const marker = `<!-- riscv-gcc-test-report:${arch}-${abi} -->`;
            let header;
            if (!hasBaseline) {
              header = `ℹ️ RISC-V GCC test (\`${arch}/${abi}\`): ` +
                `${failCount} unexpected result(s); no baseline available.`;
            } else if (regressionCount === 0) {
              header = `✅ RISC-V GCC test (\`${arch}/${abi}\`): ` +
                `no regressions vs baseline ` +
                `(${failCount} unexpected results, ${fixedCount} fixed).`;
            } else {
              header = `❌ RISC-V GCC test (\`${arch}/${abi}\`): ` +
                `${regressionCount} new regression(s) vs baseline ` +
                `(${failCount} total unexpected, ${fixedCount} fixed).`;
            }

            const section = (title, body) =>
              body.trim()
                ? [
                    `<details><summary>${title}</summary>`,
                    '',
                    '```',
                    truncate(body.trim(), 50000),
                    '```',
                    '</details>',
                    '',
                  ].join('\n')
                : '';

            const body = [
              marker,
              `## ${header}`,
              '',
              section('Test summary (.sum totals)', summary),
              regressionCount > 0
                ? section(`New regressions (${regressionCount})`, regressions)
                : '',
              fixedCount > 0
                ? section(`Fixed since baseline (${fixedCount})`, fixed)
                : '',
              !hasBaseline
                ? section(`All unexpected results (${failCount})`, allUnexpected)
                : '',
            ].filter(Boolean).join('\n');

            const { owner, repo } = context.repo;

            // Find PRs associated with this commit (works for push events too).
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner, repo, commit_sha: context.sha,
            });
            const openPrs = prs.data.filter(pr => pr.state === 'open');
            if (openPrs.length === 0) {
              core.info('No open PR associated with this commit; skipping comment.');
              return;
            }

            for (const pr of openPrs) {
              const issue_number = pr.number;
              const comments = await github.paginate(
                github.rest.issues.listComments,
                { owner, repo, issue_number, per_page: 100 }
              );
              const existing = comments.find(c =>
                c.user && c.user.type === 'Bot' && c.body && c.body.includes(marker)
              );
              if (existing) {
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: existing.id, body
                });
              } else {
                await github.rest.issues.createComment({
                  owner, repo, issue_number, body
                });
              }
            }

      - name: Fail job on regressions
        if: steps.compare.outputs.regression_count != '0' && steps.compare.outputs.regression_count != ''
        run: |
          echo "New regressions vs baseline: ${{ steps.compare.outputs.regression_count }}"
          exit 1
