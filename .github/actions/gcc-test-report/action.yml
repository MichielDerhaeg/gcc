name: GCC test report
description: >
  Collect GCC testsuite .sum results, filter them against a committed
  allowlist of known-acceptable failures, upload them as an artifact, post a
  summary to any associated PR, and fail the job on any non-allowlisted
  result. Shared by the per-target toolchain test workflows.

inputs:
  sum-search-path:
    description: Directory tree to search for gcc/g++ .sum files.
    required: true
  allowlist-dir:
    description: >
      Base allowlist directory (contains a <tool>/ subdir of `STATUS: testpath`
      logs). Consumed by .github/scripts/testsuite-filter.
    required: true
  tool:
    description: Allowlist subdirectory / toolset.
    required: false
    default: gcc
  libc:
    description: C library tag used to select allowlist files (e.g. newlib).
    required: false
    default: newlib
  arch:
    description: Target arch used to select allowlist files (e.g. rv32gc, arc-em).
    required: true
  abi:
    description: Target ABI used to select allowlist files (e.g. ilp32d). May be empty.
    required: false
    default: ""
  artifact-name:
    description: Name of the uploaded test-results artifact.
    required: true
  report-marker:
    description: >
      Unique id embedded as an HTML comment in the PR comment so it can
      be found and updated on subsequent runs
      (e.g. "arc-gcc-test-report:arc-em").
    required: true
  report-label:
    description: Human label for the target shown in the PR comment (e.g. "rv64gc/lp64d").
    required: true
  report-prefix:
    description: Report title prefix shown in the PR comment (e.g. "RISC-V GCC test").
    required: true
  github-token:
    description: Token used to post the PR comment.
    required: true

runs:
  using: composite
  steps:
    - name: Collect test results
      id: collect
      shell: bash
      env:
        SUM_SEARCH_PATH: ${{ inputs.sum-search-path }}
      run: |
        set -e
        mkdir -p test-results
        # Locate gcc/g++ .sum files anywhere under the build tree.
        find "$SUM_SEARCH_PATH" -name '*.sum' \
          -exec cp -v {} test-results/ \; || true

        # Aggregate pass/fail counters from the .sum files.
        summary=test-results/summary.txt
        : > "$summary"
        for f in test-results/*.sum; do
          [ -f "$f" ] || continue
          echo "=== $(basename "$f") ===" >> "$summary"
          grep -E '^# of ' "$f" >> "$summary" || true
          echo "" >> "$summary"
        done

        sum_count=$(ls -1 test-results/*.sum 2>/dev/null | wc -l | tr -d ' ')
        echo "sum_count=$sum_count" >> "$GITHUB_OUTPUT"
        echo "Collected .sum files: $sum_count"
        if [ "$sum_count" = "0" ]; then
          echo "::error::No .sum files produced; treating as build failure."
          exit 1
        fi

    - name: Filter against allowlist
      id: filter
      shell: bash
      env:
        ALLOWLIST_DIR: ${{ inputs.allowlist-dir }}
        TOOL: ${{ inputs.tool }}
        LIBC: ${{ inputs.libc }}
        ARCH: ${{ inputs.arch }}
        ABI: ${{ inputs.abi }}
        FILTER: ${{ github.action_path }}/../../scripts/testsuite-filter
      run: |
        set -e
        regressions="test-results/regressions.txt"
        output="test-results/filter-output.txt"

        sums=$(ls -1 test-results/*.sum | paste -sd ',' -)

        set +e
        python3 "$FILTER" \
          --tool "$TOOL" \
          --libc "$LIBC" \
          --arch "$ARCH" \
          --abi "$ABI" \
          --allowlist-dir "$ALLOWLIST_DIR" \
          --out "$regressions" \
          "$sums" | tee "$output"
        rc=${PIPESTATUS[0]}
        set -e

        # rc: 0 = all allowlisted, 1 = surviving results, 2 = no .sum files.
        if [ "$rc" = "2" ]; then
          echo "::error::testsuite-filter found no .sum files."
          exit 1
        fi

        regression_count=$(wc -l < "$regressions" | tr -d ' ')
        unexpected_count=$(sed -n 's/^Unexpected results:[[:space:]]*//p' "$output" | tr -d ' ')
        allowlisted_count=$(sed -n 's/^Allowlisted (ignored):[[:space:]]*//p' "$output" | tr -d ' ')
        echo "regression_count=${regression_count:-0}" >> "$GITHUB_OUTPUT"
        echo "unexpected_count=${unexpected_count:-0}" >> "$GITHUB_OUTPUT"
        echo "allowlisted_count=${allowlisted_count:-0}" >> "$GITHUB_OUTPUT"
        echo "Non-allowlisted results: ${regression_count:-0}"

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: test-results/
        if-no-files-found: warn

    - name: Post test summary to PR
      if: always()
      uses: actions/github-script@v7
      env:
        REGRESSION_COUNT: ${{ steps.filter.outputs.regression_count }}
        UNEXPECTED_COUNT: ${{ steps.filter.outputs.unexpected_count }}
        ALLOWLISTED_COUNT: ${{ steps.filter.outputs.allowlisted_count }}
        REPORT_MARKER: ${{ inputs.report-marker }}
        REPORT_LABEL: ${{ inputs.report-label }}
        REPORT_PREFIX: ${{ inputs.report-prefix }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const regressionCount =
            parseInt(process.env.REGRESSION_COUNT || '0', 10);
          const unexpectedCount =
            parseInt(process.env.UNEXPECTED_COUNT || '0', 10);
          const allowlistedCount =
            parseInt(process.env.ALLOWLISTED_COUNT || '0', 10);
          const label = process.env.REPORT_LABEL;
          const prefix = process.env.REPORT_PREFIX;
          const markerId = process.env.REPORT_MARKER;

          const readOrEmpty = (p) => {
            try { return fs.readFileSync(p, 'utf8'); } catch (e) { return ''; }
          };
          const truncate = (s, max) =>
            s.length > max ? s.slice(0, max) + '\n... (truncated)' : s;

          const summary = readOrEmpty('test-results/summary.txt');
          const regressions = readOrEmpty('test-results/regressions.txt');
          if (!summary.trim()) {
            core.info('No test summary available; not posting a PR comment.');
            return;
          }

          const marker = `<!-- ${markerId} -->`;
          let header;
          if (regressionCount === 0) {
            header = `✅ ${prefix} (\`${label}\`): ` +
              `no non-allowlisted results ` +
              `(${unexpectedCount} unexpected, ${allowlistedCount} allowlisted).`;
          } else {
            header = `❌ ${prefix} (\`${label}\`): ` +
              `${regressionCount} non-allowlisted result(s) ` +
              `(${unexpectedCount} unexpected, ${allowlistedCount} allowlisted).`;
          }

          const section = (title, body) =>
            body.trim()
              ? [
                  `<details><summary>${title}</summary>`,
                  '',
                  '```',
                  truncate(body.trim(), 50000),
                  '```',
                  '</details>',
                  '',
                ].join('\n')
              : '';

          const body = [
            marker,
            `## ${header}`,
            '',
            section('Test summary (.sum totals)', summary),
            regressionCount > 0
              ? section(`Non-allowlisted results (${regressionCount})`, regressions)
              : '',
          ].filter(Boolean).join('\n');

          const { owner, repo } = context.repo;

          // Find PRs associated with this commit (works for push events too).
          const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
            owner, repo, commit_sha: context.sha,
          });
          const openPrs = prs.data.filter(pr => pr.state === 'open');
          if (openPrs.length === 0) {
            core.info('No open PR associated with this commit; skipping comment.');
            return;
          }

          for (const pr of openPrs) {
            const issue_number = pr.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            const existing = comments.find(c =>
              c.user && c.user.type === 'Bot' && c.body && c.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body
              });
            }
          }

    - name: Fail job on non-allowlisted results
      if: steps.filter.outputs.regression_count != '0' && steps.filter.outputs.regression_count != ''
      shell: bash
      env:
        REGRESSION_COUNT: ${{ steps.filter.outputs.regression_count }}
      run: |
        echo "Non-allowlisted results: $REGRESSION_COUNT"
        exit 1
